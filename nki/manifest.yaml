# Benchmark family manifest (sea-mlir utils/bench.py; docs/Benchmarks.md in sea-mlir).
# expected: sat | unsat | unknown-ok | pending (not run yet); tier: smoke (<5 s) | quick (<60 s) | full (<900 s) | hard
# (tracked, not gated); time: wall seconds when established; args: per-job sea-vc args
# appended to the configuration's. counters: {<stat>: {max | min | exact: N, why, seeded}} completeness bounds
# (defaults.counters, counter-rules [{jobs: regex, counters, why}], job counters; a bound without `seeded`
# is deliberate: establish never changes it).
family: nki
license: 'Apache-2.0: NKI kernels from aws-neuron/nki-library ad2f1b9 (Apache-2.0, LICENSE-nki-library, NOTICE-nki-library)
  traced by the NK-SHIM harness (Apache-2.0)'
description: NKI kernels (gather, dynamic-shape add, scatter-add) traced into sea.program by a Python shim; structural small-instance
  sweep, hardware-size gather, widthOf blowup repros
sources:
  nki-library: https://github.com/aws-neuron/nki-library ad2f1b921d8e5949fa3b9a186e5f9130269353dc
defaults:
  args: [--lower, --seam]
  timeout: 900
  mem: 16384
counter-rules:
- jobs: ^(sweep-gather-.*-(good|nopre)|gather-hw-.*-all-(good|nopre)|sweep-dyn-.*)$
  counters:
    vc.ackermann-constraints:
      max: 0
  why: 'design promise (application study NK-GATHER / NK-DYN): SeaM resolves every read of gather and dynamic-shape add, so
    the eager Ackermann lowering adds no constraint. The mutants that change an address (mut-*) have real alias questions:
    their bounds are seeded observations. Regression caught: S2b sameAddr (fixed 2a30bf3) gave 8 on sweep-gather-N2-D3-K1
    and 11280 on gather-hw-N64D16K32-all-good'
